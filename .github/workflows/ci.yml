name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  HOP_SERP_PROVIDER: sandbox
  HOP_MODEL_PROVIDER: mock

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: test (Python ${{ matrix.python }}, SQLite)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            install: pip install -r requirements.lock && pip install --no-deps -e .
          - python: "3.11"
            install: pip install -e ".[dashboard,dev,postgres]"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: ${{ matrix.install }}
      - name: Validate domain packs
        run: |
          hop domain validate sports-footwear
          hop domain validate outdoor-apparel
      - run: pytest
      - name: Sandbox run (CLI)
        env:
          HOP_DATA_DIR: ${{ runner.temp }}/hop
        run: |
          hop collection run --market HK --tier A
          hop audit verify
          hop evaluation run

  test-postgres:
    name: test (Python 3.12, Postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hop
          POSTGRES_PASSWORD: hop
          POSTGRES_DB: hop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hop -d hop"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      HOP_TEST_DATABASE_URL: postgresql+psycopg://hop:hop@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - name: Ensure pg_dump 16 for the backup round-trip test
        run: |
          if ! pg_dump --version 2>/dev/null | grep -q ' 1[6-9]\.'; then
            sudo apt-get update -q && sudo apt-get install -y -q postgresql-client-16
          fi
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/16/bin/pg_dump --version
      - run: pytest
      - name: Sandbox run against Postgres
        env:
          DATABASE_URL: postgresql+psycopg://hop:hop@localhost:5432/hop
          HOP_DATA_DIR: ${{ runner.temp }}/hop
        run: |
          hop collection run --market HK --tier A
          hop audit verify

  compose:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose -f infrastructure/docker-compose.yml up --build --detach --wait --wait-timeout 300
      - name: Sandbox run inside the app container
        run: |
          docker compose -f infrastructure/docker-compose.yml exec -T -e HOP_SERP_PROVIDER=sandbox \
            -e HOP_MODEL_PROVIDER=mock app hop collection run --market HK --tier A
      - name: Hit the API and dashboard
        run: |
          curl -fsS localhost:8000/health
          curl -fsS -H 'X-HOP-User: ci' -H 'X-HOP-Role: analyst' localhost:8000/opportunities | head -c 400
          curl -fsS localhost:8501/_stcore/health
      - name: Logs on failure
        if: failure()
        run: docker compose -f infrastructure/docker-compose.yml logs --no-color
      - if: always()
        run: docker compose -f infrastructure/docker-compose.yml down -v
