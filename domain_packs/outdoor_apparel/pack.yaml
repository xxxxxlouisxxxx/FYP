pack_id: outdoor-apparel
name: Outdoor Apparel - Hiking and Travel Wear
version: 0.1.0
owner: domain-stewards-apparel
description: >-
  Proof-of-concept second domain pack (spec 2.2). It runs on the same platform runtime and
  Opportunity Intelligence product as sports-footwear, with only configuration and sandbox fixtures:
  markets, brand registry, need taxonomy, attributes, queries, sources, prompts, evaluation sets and
  rules. Initial scope: Hong Kong, English queries.
platform_compat: ">=0.1,<1.0"
files:
  markets: markets/markets.yaml
  sources: markets/source_types.yaml
  entities: brands/brands.yaml
  taxonomy: taxonomy/needs.yaml
  queries: taxonomy/queries.yaml
  attributes: attributes/attributes.yaml
  prompts: prompts/prompts.yaml
  evaluation_suites: evaluation_sets/suites.yaml
  sandbox_fixtures: sandbox
extensions:
  opportunity_intelligence:
    gap_rules: rules/gap_rules.yaml
    admission_gates: rules/admission_gates.yaml
    scoring: scoring/scoring_rubric.yaml
    quality_ratchet: evaluation_sets/quality_ratchet.yaml
