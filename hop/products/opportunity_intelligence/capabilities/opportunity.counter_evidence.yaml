capability_id: opportunity.counter_evidence
version: 2.0.0
kind: agent
owner: domain-product-owner-footwear
status: approved
purpose: Identify evidence that weakens a proposed opportunity (searches acquired evidence only).
input_schema: gap_candidate_v1
output_schema: counter_evidence_result_v2
permissions: [evidence.read]
allowed_tools: [evidence.search, taxonomy.lookup]
evidence_classes: [DEMAND_SIGNAL, SERP_RESULT, GERP_ANSWER, GERP_PRIMARY_RECOMMENDATION, GERP_SUPPORTING_RECOMMENDATION, GERP_CITATION]
network_policy:
  outbound_allowlist: []
max_steps: 8
max_duration_seconds: 120
max_cost_usd: 0.50
abstain_when: [insufficient_evidence, conflicting_entity_resolution]
human_review: required_for_high_priority
