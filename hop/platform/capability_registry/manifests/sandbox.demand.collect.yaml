capability_id: sandbox.demand.collect
version: 1.0.0
kind: collector
owner: data-platform-team
status: approved
purpose: Replay recorded DataForSEO-shaped search-volume payloads from sandbox fixtures (no network).
input_schema: demand_collection_request_v1
output_schema: demand_observation_v1
permissions: [object_store.raw_write, fixtures.read]
allowed_tools: [provider.fixture_read]
evidence_classes: [DEMAND_SIGNAL]
network_policy:
  outbound_allowlist: []
max_steps: 20
max_duration_seconds: 300
max_cost_usd: 2.0
cost_model: {unit: provider_task, unit_cost_usd: 0.075, simulated: true}
documentation: {runbook: docs/tutorials/first-sandbox-run.md}
